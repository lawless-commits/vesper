[package]
name = "vesper"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-first AI companion studio: persona bots, local model runtimes and a scheduled autopilot."
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros"] }
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
futures-util = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
base64 = "0.23"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
